{% extends "base.html" %}
{% block title %}New Question Paper{% endblock %}
{% block content %}
<div class="page-head"><div><h1>New Question Paper</h1><p class="desc">Set up the paper details, then add questions.</p></div></div>
<div class="card">
  <form method="POST">
    <div class="form-grid">
      <div class="form-group full"><label>Title *</label><input type="text" name="title" required placeholder="e.g. Half Yearly Examination - Mathematics"></div>
      <div class="form-group"><label>Class</label>
        <select name="class_id">
          <option value="">Select class</option>
          {% for c in classes %}<option value="{{ c.id }}">{{ c.class_name }}-{{ c.section }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group"><label>Subject</label>
        <select name="subject_id">
          <option value="">Select subject</option>
          {% for s in subjects %}<option value="{{ s.id }}">{{ s.subject_name }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group"><label>Linked Exam (optional)</label>
        <select name="exam_id">
          <option value="">None</option>
          {% for e in exams %}<option value="{{ e.id }}">{{ e.exam_name }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group"><label>Academic Session</label><input type="text" name="academic_session" placeholder="e.g. 2026-27"></div>
      <div class="form-group"><label>Total Marks</label><input type="number" name="total_marks" placeholder="e.g. 80"></div>
      <div class="form-group"><label>Duration</label><input type="text" name="duration" placeholder="e.g. 3 Hours"></div>
      <div class="form-group full"><label>General Instructions</label><textarea name="instructions" placeholder="e.g. All questions are compulsory. Read the instructions carefully."></textarea></div>
    </div>
    <div style="display:flex; gap:12px; margin-top:20px;">
      <button type="submit" class="btn btn-primary btn-lg">Continue to Add Questions</button>
      <a href="{{ url_for('qp_list') }}" class="btn btn-secondary btn-lg">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
